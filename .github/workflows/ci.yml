name: Validate Plugin Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build plugin
        run: |
          mkdir -p dist
          bun run build -- --release --of dist

      - name: Verify package
        run: |
          PACKAGE="$(find dist -maxdepth 1 -type f -name '*.star' -print -quit)"
          test -n "$PACKAGE"
          ./node_modules/.bin/starlight verify "$PACKAGE"

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: Autoplay-Mute-star
          path: dist/*.star
          if-no-files-found: error
