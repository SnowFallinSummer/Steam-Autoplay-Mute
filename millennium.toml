[plugin]
id = "com.snowfallinsummer.autoplaymute"
name = "Autoplay Mute"
version = "0.1.0"
author = "SnowFallinSummer"
description = "Keeps videos in Steam's built-in browser muted without stopping playback."

[webkit]
entry = "preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"
