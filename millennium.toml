[plugin]
id = "com.snowfallinsummer.autoplaymute"
name = "Autoplay Mute"
version = "0.1.0"
author = "SnowFallinSummer"
description = "Automatically mutes native HTML5 videos in Steam's embedded Store and Community views."

[webkit]
entry = "preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"
